name: getech_sms_mobile
description: "Application mobile companion (iOS + Android) pour le système de gestion scolaire GeTech-SMS. Offline-first, synchronisation avec le terminal principal desktop (FastAPI)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Local database (Drift / SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Background sync
  workmanager: ^0.5.2
  background_fetch: ^1.3.7

  # Local preferences
  shared_preferences: ^2.3.0

  # mDNS / Bonjour discovery (module Connexions)
  bonsoir: ^5.1.2

  # QR code (module Connexions)
  mobile_scanner: ^5.2.1
  qr_flutter: ^4.1.0

  # Serialization / utils
  intl: ^0.19.0
  collection: ^1.18.0
  logger: ^2.4.0

  # Images & files
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen (Drift)
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
    - assets/icons/
